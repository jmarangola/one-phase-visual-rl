<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Teaser intro draft · One Phase Is Enough</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#1a1a1a;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1440px;margin:0 auto;padding:36px 24px}a{color:#2a78d6;text-decoration:none}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin:24px 0 18px}h1{font-size:24px;letter-spacing:-.025em;margin:0}nav{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;border:1px solid #dfe2e7;border-radius:7px;background:#fff;padding:7px 14px;color:#535963;cursor:pointer}button[aria-pressed=true]{background:#1e2228;color:#fff;border-color:#1e2228}video{display:block;width:100%;aspect-ratio:20/9;border-radius:10px;background:#f7f8fa}footer{display:flex;gap:20px;margin-top:16px;color:#737981;font-size:13px}@media(max-width:650px){main{padding:22px 12px}header{align-items:start;flex-direction:column;gap:12px}h1{font-size:21px}footer{flex-wrap:wrap}}
</style>
</head>
<body><main>
<a href="../#teaser-headline">← Project website</a>
<header><h1>Teaser intro draft</h1><nav aria-label="Preview length">
<button id="opening" aria-pressed="true">Opening</button><button id="full" aria-pressed="false">Full teaser</button><button id="replay">↻ Replay</button>
</nav></header>
<video id="preview" src="videos/teaser-draft/teaser-typed-opening-draft.mp4" poster="videos/teaser-draft/teaser-typed-intro-poster.jpg" controls autoplay muted loop playsinline preload="auto"></video>
<footer><span>Draft · the current homepage teaser is unchanged.</span><a id="download" href="videos/teaser-draft/teaser-typed-intro-draft.mp4" download>Download full draft</a></footer>
</main><script>
const video=document.querySelector('#preview');
for(const mode of ['opening','full'])document.getElementById(mode).onclick=()=>{
 video.src='videos/teaser-draft/'+(mode==='opening'?'teaser-typed-opening-draft.mp4':'teaser-typed-intro-draft.mp4');
 for(const id of ['opening','full'])document.getElementById(id).setAttribute('aria-pressed',String(id===mode));
 video.play().catch(()=>{});
};
document.querySelector('#replay').onclick=()=>{video.currentTime=0;video.play().catch(()=>{});};
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><title>Camera independence check</title><script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js"}}</script></head><body><canvas width="640" height="360" style="width:640px;height:360px"></canvas><pre>Checking spectator / policy camera independence…</pre><script type="module">
import PhysX from './vendor/physx/physx-js-webidl.mjs';
import {downloadAssets,decodeJSON} from './assets.js';
import {createPhysics} from './physics.js';
import {createRenderer} from './renderer.js';
let view,physics;
try{
 const manifest=await(await fetch('./assets-manifest.json')).json();
 const assets=await downloadAssets(manifest,()=>{});
 const spec=decodeJSON(assets.get(manifest.scene.spec));
 const getAsset=async path=>assets.get(manifest.scene.base+path);
 physics=await createPhysics(await PhysX({wasmBinary:assets.get(manifest.physics.wasm)}),spec,{getAsset});
 view=await createRenderer(document.querySelector('canvas'),spec,{getAsset});
 view.update(physics.getBodyPoses());view.render();
 const before=view.readPolicyRGB().slice(),wristBefore=view.wrist.matrixWorld.toArray();
 view.viewCamera.position.set(-.9,1.3,1.1);view.viewCamera.lookAt(0,.7,.1);view.render();
 const after=view.readPolicyRGB().slice();
 let changed=0;for(let i=0;i<before.length;i++)if(before[i]!==after[i])changed++;
 const wristUnchanged=wristBefore.every((v,i)=>v===view.wrist.matrixWorld.elements[i]);
 view.resetCamera();
 const resetPosition=view.viewCamera.position.toArray();
 const desktopControls=document.querySelector('canvas').classList.contains('camera-controls');
 view.dispose();physics.dispose();view=null;physics=null;
 document.querySelector('pre').textContent=JSON.stringify({changedPolicyRGBBytes:changed,wristMatrixUnchanged:wristUnchanged,resetPosition,desktopControls,disposeSucceeded:true,passed:changed===0&&wristUnchanged},null,2);
}catch(error){document.querySelector('pre').textContent=String(error.stack||error);try{view?.dispose();physics?.dispose();}catch{}}
</script></body></html>
